# Publishes the package to PyPI with Trusted Publishing (no API token).
# On PyPI add a pending publisher: owner wsmhj, repo zapmatte-green-screen-remover,
# workflow publish-pypi.yml, environment pypi. Run it from the Actions tab.
name: Publish to PyPI
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
