# Builds the Cog image and pushes it to Replicate.
# Needs repo secret REPLICATE_API_TOKEN and repo variable REPLICATE_MODEL
# (e.g. r8.im/<user>/green-screen-remover). Run it from the Actions tab.
name: Push to Replicate
on:
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false
      - uses: actions/checkout@v4
      - uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}
      - run: cog push ${{ vars.REPLICATE_MODEL }}
